<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AI Counsellor</title>
  <link rel="stylesheet" href="css/login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="auth-container">
    <div style="text-align: center; margin-bottom: 5px;">
      <a href="index.html">
        <img src="vistonaut.png" alt="Vistonaut Logo" style="height: 55px; filter: drop-shadow(0 0 10px rgba(217, 70, 239, 0.4));">
      </a>
    </div>
    <h1>Welcome Back</h1>
    <p>Login to continue your study-abroad journey</p>
    
    <div id="errorMessage" class="error-message"></div>
    
    <form id="loginForm">
      <div class="form-group" id="emailGroup">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      
      <div class="form-group" id="passwordGroup">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>

      <div class="form-group" id="otpGroup" style="display: none;">
        <label for="otpCode">6-Digit Security Code</label>
        <input type="text" id="otpCode" name="otpCode" maxlength="6" pattern="\d{6}">
      </div>
      
      <button type="submit" id="mainSubmitBtn" class="btn-submit">Login Secured</button>
    </form>

    <div style="text-align: center; margin: 15px 0;">
      <button id="toggleOtpBtn" type="button" style="background: none; border: none; color: var(--primary-color); cursor: pointer; font-family: 'Inter', sans-serif; font-size: 0.9rem;">Sign in with OTP Instead</button>
    </div>

    <div class="divider"><span>OR</span></div>

    <div id="g_id_onload"
         data-client_id="1005531152056-bq8k8njrdnmbdi1tv04a1h07a0n0t74b.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="handleGoogleLogin"
         data-auto_prompt="false">
    </div>

    <div class="g_id_signin"
         data-type="standard"
         data-shape="rectangular"
         data-theme="outline"
         data-text="continue_with"
         data-size="large"
         data-logo_alignment="left"
         style="display: flex; justify-content: center; width: 100%; margin-top: 15px;">
    </div>
    
    <div class="auth-links">
      <p>Need access? <a href="signup.html">Initialize Profile</a></p>
      <p><a href="index.html">Back to Home</a></p>
    </div>
  </div>

  <!-- Account Not Found Signup Modal Popup -->
  <div id="signUpModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="8.5" cy="7" r="4"></circle>
          <line x1="20" y1="8" x2="20" y2="14"></line>
          <line x1="23" y1="11" x2="17" y2="11"></line>
        </svg>
      </div>
      <h2>Account Not Found</h2>
      <p>No account exists for <strong id="modalEmailSpan"></strong>. Would you like to create a new account instead?</p>
      <div class="modal-actions">
        <button type="button" id="closeModalBtn" class="btn-modal-secondary">Try Again</button>
        <a id="signupRedirectBtn" href="signup.html" class="btn-modal-primary">Sign Up Instead</a>
      </div>
    </div>
  </div>

  <style>
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 32px 28px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-sizing: border-box;
    }
    .modal-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(79, 70, 229, 0.1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .modal-card h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.4rem;
      color: #0f172a;
      margin: 0 0 10px 0;
      font-weight: 700;
    }
    .modal-card p {
      color: #64748b;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .modal-card strong {
      color: #0f172a;
      word-break: break-all;
    }
    .modal-actions {
      display: flex;
      gap: 12px;
    }
    .btn-modal-primary {
      flex: 1;
      padding: 12px;
      background: #4f46e5;
      color: #ffffff !important;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.92rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }
    .btn-modal-primary:hover {
      background: #4338ca;
    }
    .btn-modal-secondary {
      flex: 1;
      padding: 12px;
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .btn-modal-secondary:hover {
      background: #f8fafc;
    }
  </style>

  <script src="js/auth.js"></script>
  <script>
    let loginMode = 'password'; // 'password', 'otp-request', 'otp-verify'
    
    const loginForm = document.getElementById('loginForm');
    const toggleOtpBtn = document.getElementById('toggleOtpBtn');
    const passwordGroup = document.getElementById('passwordGroup');
    const otpGroup = document.getElementById('otpGroup');
    const mainSubmitBtn = document.getElementById('mainSubmitBtn');
    const passwordInput = document.getElementById('password');
    const otpInput = document.getElementById('otpCode');
    const emailInput = document.getElementById('email');
    const errorDiv = document.getElementById('errorMessage');

    function showSignUpModal(email) {
      const modal = document.getElementById('signUpModal');
      const emailSpan = document.getElementById('modalEmailSpan');
      const redirectBtn = document.getElementById('signupRedirectBtn');
      
      emailSpan.textContent = email;
      redirectBtn.href = `signup.html?email=${encodeURIComponent(email)}`;
      modal.style.display = 'flex';
    }

    document.getElementById('closeModalBtn').addEventListener('click', () => {
      document.getElementById('signUpModal').style.display = 'none';
    });

    toggleOtpBtn.addEventListener('click', () => {
      errorDiv.style.display = 'none';
      if (loginMode === 'password') {
        loginMode = 'otp-request';
        passwordGroup.style.display = 'none';
        passwordInput.required = false;
        mainSubmitBtn.textContent = 'Request Authenticator Code';
        toggleOtpBtn.textContent = 'Sign in with Password Instead';
      } else {
        loginMode = 'password';
        passwordGroup.style.display = 'block';
        otpGroup.style.display = 'none';
        passwordInput.required = true;
        otpInput.required = false;
        mainSubmitBtn.textContent = 'Login Secured';
        toggleOtpBtn.textContent = 'Sign in with OTP Instead';
        emailInput.disabled = false;
      }
    });

    async function handleGoogleLogin(response) {
      errorDiv.style.display = 'none';
      try {
        const serverResponse = await apiRequest('/auth/google', { 
          method: 'POST', 
          body: JSON.stringify({ credential: response.credential }) 
        });
        setToken(serverResponse.token);
        setCurrentUser(serverResponse.user);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorDiv.textContent = err.message || "Google Authentication failed. Please verify API configuration.";
        errorDiv.style.display = 'block';
      }
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.style.display = 'none';
      
      const email = emailInput.value.trim();
      const originalBtnText = mainSubmitBtn.textContent;
      
      mainSubmitBtn.disabled = true;
      mainSubmitBtn.textContent = 'Authenticating...';
      mainSubmitBtn.style.opacity = '0.7';
      mainSubmitBtn.style.cursor = 'not-allowed';

      try {
        if (loginMode === 'password') {
          const password = passwordInput.value;
          await login(email, password);
          window.location.href = 'dashboard.html';
        } else if (loginMode === 'otp-request') {
          const res = await apiRequest('/auth/otp/send', { method: 'POST', body: JSON.stringify({ email }) });
          loginMode = 'otp-verify';
          otpGroup.style.display = 'block';
          otpInput.required = true;
          emailInput.disabled = true;
          mainSubmitBtn.textContent = 'Verify Security Code';
          mainSubmitBtn.disabled = false;
          mainSubmitBtn.style.opacity = '1';
          mainSubmitBtn.style.cursor = 'pointer';

          if (res.devCode) {
            errorDiv.style.background = 'rgba(99, 102, 241, 0.15)';
            errorDiv.style.borderColor = 'rgba(99, 102, 241, 0.4)';
            errorDiv.style.color = '#818cf8';
            errorDiv.textContent = `[Dev Mode] Security Code: ${res.devCode}`;
            errorDiv.style.display = 'block';
          }
        } else if (loginMode === 'otp-verify') {
          const response = await apiRequest('/auth/otp/verify', { method: 'POST', body: JSON.stringify({ email, code: otpInput.value.trim() }) });
          setToken(response.token);
          setCurrentUser(response.user);
          window.location.href = 'dashboard.html';
        }
      } catch (error) {
        mainSubmitBtn.disabled = false;
        mainSubmitBtn.textContent = originalBtnText;
        mainSubmitBtn.style.opacity = '1';
        mainSubmitBtn.style.cursor = 'pointer';
        
        // Show modal popup if email does not exist in DB
        if (error.status === 404 || (error.data && error.data.userNotFound)) {
          showSignUpModal(email);
          return;
        }

        errorDiv.style.background = '';
        errorDiv.style.borderColor = '';
        errorDiv.style.color = '';
        errorDiv.textContent = error.message || 'Authentication failed. Please check your credentials.';
        errorDiv.style.display = 'block';
      }
    });

    // Redirect if already logged in
    if (checkAuth()) {
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
