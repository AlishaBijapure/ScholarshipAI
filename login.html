<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AI Counsellor</title>
  <link rel="stylesheet" href="css/login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="auth-container">
    <div style="text-align: center; margin-bottom: 5px;">
      <a href="index.html">
        <img src="vistonaut.png" alt="Vistonaut Logo" style="height: 55px; filter: drop-shadow(0 0 10px rgba(217, 70, 239, 0.4));">
      </a>
    </div>
    <h1>Welcome Back</h1>
    <p>Login to continue your study-abroad journey</p>
    
    <div id="errorMessage" class="error-message"></div>
    
    <form id="loginForm">
      <div class="form-group" id="emailGroup">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      
      <div class="form-group" id="passwordGroup">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>

      <div class="form-group" id="otpGroup" style="display: none;">
        <label for="otpCode">6-Digit Security Code</label>
        <input type="text" id="otpCode" name="otpCode" maxlength="6" pattern="\d{6}">
      </div>
      
      <button type="submit" id="mainSubmitBtn" class="btn-submit">Login Secured</button>
    </form>

    <div style="text-align: center; margin: 15px 0;">
      <button id="toggleOtpBtn" type="button" style="background: none; border: none; color: var(--primary-color); cursor: pointer; font-family: 'Inter', sans-serif; font-size: 0.9rem;">Sign in with OTP Instead</button>
    </div>

    <div class="divider"><span>OR</span></div>

    <div id="g_id_onload"
         data-client_id="1005531152056-bq8k8njrdnmbdi1tv04a1h07a0n0t74b.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="handleGoogleLogin"
         data-auto_prompt="false">
    </div>

    <div class="g_id_signin"
         data-type="standard"
         data-shape="rectangular"
         data-theme="outline"
         data-text="continue_with"
         data-size="large"
         data-logo_alignment="left"
         style="display: flex; justify-content: center; width: 100%; margin-top: 15px;">
    </div>
    
    <div class="auth-links">
      <p>Need access? <a href="signup.html">Initialize Profile</a></p>
      <p><a href="index.html">Back to Home</a></p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    let loginMode = 'password'; // 'password', 'otp-request', 'otp-verify'
    
    const loginForm = document.getElementById('loginForm');
    const toggleOtpBtn = document.getElementById('toggleOtpBtn');
    const passwordGroup = document.getElementById('passwordGroup');
    const otpGroup = document.getElementById('otpGroup');
    const mainSubmitBtn = document.getElementById('mainSubmitBtn');
    const passwordInput = document.getElementById('password');
    const otpInput = document.getElementById('otpCode');
    const emailInput = document.getElementById('email');
    const errorDiv = document.getElementById('errorMessage');

    toggleOtpBtn.addEventListener('click', () => {
      errorDiv.style.display = 'none';
      if (loginMode === 'password') {
        loginMode = 'otp-request';
        passwordGroup.style.display = 'none';
        passwordInput.required = false;
        mainSubmitBtn.textContent = 'Request Authenticator Code';
        toggleOtpBtn.textContent = 'Sign in with Password Instead';
      } else {
        loginMode = 'password';
        passwordGroup.style.display = 'block';
        otpGroup.style.display = 'none';
        passwordInput.required = true;
        otpInput.required = false;
        mainSubmitBtn.textContent = 'Login Secured';
        toggleOtpBtn.textContent = 'Sign in with OTP Instead';
        emailInput.disabled = false;
      }
    });

    async function handleGoogleLogin(response) {
      errorDiv.style.display = 'none';
      try {
        const serverResponse = await apiRequest('/auth/google', { 
          method: 'POST', 
          body: JSON.stringify({ credential: response.credential }) 
        });
        setToken(serverResponse.token);
        setCurrentUser(serverResponse.user);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorDiv.textContent = err.message || "Google Authentication failed. Please verify API configuration.";
        errorDiv.style.display = 'block';
      }
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.style.display = 'none';
      
      const email = emailInput.value.trim();
      const originalBtnText = mainSubmitBtn.textContent;
      
      mainSubmitBtn.disabled = true;
      mainSubmitBtn.textContent = 'Authenticating...';
      mainSubmitBtn.style.opacity = '0.7';
      mainSubmitBtn.style.cursor = 'not-allowed';

      try {
        if (loginMode === 'password') {
          const password = passwordInput.value;
          await login(email, password);
          window.location.href = 'dashboard.html';
        } else if (loginMode === 'otp-request') {
          const res = await apiRequest('/auth/otp/send', { method: 'POST', body: JSON.stringify({ email }) });
          loginMode = 'otp-verify';
          otpGroup.style.display = 'block';
          otpInput.required = true;
          emailInput.disabled = true;
          mainSubmitBtn.textContent = 'Verify Security Code';
          mainSubmitBtn.disabled = false;
          mainSubmitBtn.style.opacity = '1';
          mainSubmitBtn.style.cursor = 'pointer';

          if (res.devCode) {
            errorDiv.style.background = 'rgba(99, 102, 241, 0.15)';
            errorDiv.style.borderColor = 'rgba(99, 102, 241, 0.4)';
            errorDiv.style.color = '#818cf8';
            errorDiv.textContent = `[Dev Mode] Security Code: ${res.devCode}`;
            errorDiv.style.display = 'block';
          }
        } else if (loginMode === 'otp-verify') {
          const response = await apiRequest('/auth/otp/verify', { method: 'POST', body: JSON.stringify({ email, code: otpInput.value.trim() }) });
          setToken(response.token);
          setCurrentUser(response.user);
          window.location.href = 'dashboard.html';
        }
      } catch (error) {
        mainSubmitBtn.disabled = false;
        mainSubmitBtn.textContent = originalBtnText;
        mainSubmitBtn.style.opacity = '1';
        mainSubmitBtn.style.cursor = 'pointer';
        
        errorDiv.style.background = '';
        errorDiv.style.borderColor = '';
        errorDiv.style.color = '';
        errorDiv.textContent = error.message || 'Authentication failed. Please check your credentials.';
        errorDiv.style.display = 'block';
      }
    });

    // Redirect if already logged in
    if (checkAuth()) {
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
