<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - AI Counsellor</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    .auth-container {
      max-width: 450px;
      margin: 80px auto;
      padding: 40px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    .auth-container h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #fff;
    }

    .auth-container p {
      text-align: center;
      color: var(--text-light);
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-medium);
      font-weight: 500;
      font-family: 'Outfit', sans-serif;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      font-size: 16px;
      color: white;
      transition: all 0.3s;
      box-sizing: border-box;
      font-family: inherit;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 15px rgba(123, 97, 255, 0.2);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(255, 255, 255, 0.15);
      background: #f1f5f9;
    }

    .error-message {
      background: rgba(244, 63, 94, 0.1);
      color: var(--danger-color);
      border: 1px solid rgba(244, 63, 94, 0.2);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .auth-links {
      text-align: center;
      margin-top: 20px;
    }

    .auth-links a {
      color: var(--primary-color);
      text-decoration: none;
    }
    .auth-links a:hover {
      text-shadow: 0 0 10px rgba(123, 97, 255, 0.4);
    }
    .btn-google {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 15px;
    }
    .btn-google:hover {
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 5px 20px rgba(255, 255, 255, 0.05);
    }
    .btn-google svg {
      width: 20px;
      height: 20px;
      margin-right: 10px;
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 25px 0 10px 0;
      color: var(--text-light);
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }
    .divider span {
      margin: 0 15px;
      font-size: 14px;
    }
    @media (max-width: 480px) {
      .auth-container {
        padding: 24px;
        margin: 40px 15px; /* Give the container breathing room from screen edges */
        border-radius: 12px;
      }
      .auth-container h1 {
        font-size: 1.8rem;
      }
      .g_id_signin {
        transform: scale(0.9); /* Prevent Google Button from overflowing on tiny screens */
        transform-origin: center;
      }
    }
  </style>
</head>

<body>
  <div class="auth-container">
    <div style="text-align: center; margin-bottom: 5px;">
      <a href="index.html">
        <img src="vistonaut.png" alt="Vistonaut Logo" style="height: 55px; filter: drop-shadow(0 0 10px rgba(217, 70, 239, 0.4));">
      </a>
    </div>
    <h1>Create Your Account</h1>
    <p>Start your study-abroad journey today</p>

    <div id="errorMessage" class="error-message"></div>

    <form id="signupForm">
      <div class="form-group" id="fullNameGroup">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" required>
      </div>

      <div class="form-group" id="emailGroup">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group" id="passwordGroup">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="6">
      </div>

      <div class="form-group" id="otpGroup" style="display: none;">
        <label for="otpCode">6-Digit Security Code</label>
        <input type="text" id="otpCode" name="otpCode" maxlength="6" pattern="\d{6}">
      </div>

      <button type="submit" id="mainSubmitBtn" class="btn-submit">Sign Up</button>
    </form>

    <div style="text-align: center; margin: 15px 0;">
      <button id="toggleOtpBtn" type="button" style="background: none; border: none; color: var(--primary-color); cursor: pointer; font-family: 'Inter', sans-serif; font-size: 0.9rem;">Sign up without Password (OTP)</button>
    </div>

    <div class="divider"><span>OR</span></div>

    <div id="g_id_onload"
         data-client_id="1005531152056-bq8k8njrdnmbdi1tv04a1h07a0n0t74b.apps.googleusercontent.com"
         data-context="signup"
         data-ux_mode="popup"
         data-callback="handleGoogleLogin"
         data-auto_prompt="false">
    </div>

    <div class="g_id_signin"
         data-type="standard"
         data-shape="rectangular"
         data-theme="filled_black"
         data-text="continue_with"
         data-size="large"
         data-logo_alignment="left"
         style="display: flex; justify-content: center; width: 100%; margin-top: 15px;">
    </div>

    <div class="auth-links">
      <p>Already have an account? <a href="login.html">Login</a></p>
      <p><a href="index.html">Back to Home</a></p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    let signupMode = 'password'; // 'password', 'otp-request', 'otp-verify'
    
    const signupForm = document.getElementById('signupForm');
    const toggleOtpBtn = document.getElementById('toggleOtpBtn');
    const fullNameGroup = document.getElementById('fullNameGroup');
    const passwordGroup = document.getElementById('passwordGroup');
    const otpGroup = document.getElementById('otpGroup');
    const mainSubmitBtn = document.getElementById('mainSubmitBtn');
    const fullNameInput = document.getElementById('fullName');
    const passwordInput = document.getElementById('password');
    const otpInput = document.getElementById('otpCode');
    const emailInput = document.getElementById('email');
    const errorDiv = document.getElementById('errorMessage');

    toggleOtpBtn.addEventListener('click', () => {
      errorDiv.style.display = 'none';
      if (signupMode === 'password') {
        signupMode = 'otp-request';
        passwordGroup.style.display = 'none';
        fullNameGroup.style.display = 'none';
        passwordInput.disabled = false;
        fullNameInput.disabled = false;
        passwordInput.required = false;
        fullNameInput.required = false;
        mainSubmitBtn.textContent = 'Request Authenticator Code';
        toggleOtpBtn.textContent = 'Sign up with Password Instead';
      } else {
        signupMode = 'password';
        passwordGroup.style.display = 'block';
        fullNameGroup.style.display = 'block';
        otpGroup.style.display = 'none';
        passwordInput.disabled = false;
        fullNameInput.disabled = false;
        emailInput.disabled = false;
        passwordInput.required = true;
        fullNameInput.required = true;
        otpInput.required = false;
        mainSubmitBtn.textContent = 'Sign Up';
        toggleOtpBtn.textContent = 'Sign up without Password (OTP)';
      }
    });

    async function handleGoogleLogin(response) {
      errorDiv.style.display = 'none';
      try {
        const serverResponse = await apiRequest('/auth/google', { 
          method: 'POST', 
          body: JSON.stringify({ credential: response.credential }) 
        });
        setToken(serverResponse.token);
        setCurrentUser(serverResponse.user);
        window.location.href = 'onboarding.html';
      } catch (err) {
        errorDiv.textContent = err.message || "Google Authentication failed. Please verify API configuration.";
        errorDiv.style.display = 'block';
      }
    }

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.style.display = 'none';
      
      const email = emailInput.value;
      const originalBtnText = mainSubmitBtn.textContent;
      
      mainSubmitBtn.disabled = true;
      mainSubmitBtn.textContent = 'Authenticating...';
      mainSubmitBtn.style.opacity = '0.7';
      mainSubmitBtn.style.cursor = 'not-allowed';

      try {
        if (signupMode === 'password') {
          // Intercept password signup to force email verification
          await apiRequest('/auth/otp/send', { method: 'POST', body: JSON.stringify({ email, action: 'signup' }) });
          signupMode = 'password-verify';
          otpGroup.style.display = 'block';
          otpInput.required = true;
          // Disable prior fields to lock the state
          fullNameInput.disabled = true;
          emailInput.disabled = true;
          passwordInput.disabled = true;
          
          mainSubmitBtn.textContent = 'Verify Email & Create Account';
          mainSubmitBtn.disabled = false;
          mainSubmitBtn.style.opacity = '1';
          mainSubmitBtn.style.cursor = 'pointer';
        } else if (signupMode === 'password-verify') {
          const payload = {
              fullName: fullNameInput.value,
              email: emailInput.value,
              password: passwordInput.value,
              otpCode: otpInput.value
          };
          const response = await apiRequest('/auth/signup', { method: 'POST', body: JSON.stringify(payload) });
          setToken(response.token);
          setCurrentUser(response.user);
          window.location.href = 'onboarding.html';
        } else if (signupMode === 'otp-request') {
          await apiRequest('/auth/otp/send', { method: 'POST', body: JSON.stringify({ email, action: 'signup' }) });
          signupMode = 'otp-verify';
          otpGroup.style.display = 'block';
          otpInput.required = true;
          emailInput.disabled = true;
          mainSubmitBtn.textContent = 'Verify Security Code';
          mainSubmitBtn.disabled = false;
          mainSubmitBtn.style.opacity = '1';
          mainSubmitBtn.style.cursor = 'pointer';
        } else if (signupMode === 'otp-verify') {
          const response = await apiRequest('/auth/otp/verify', { method: 'POST', body: JSON.stringify({ email, code: otpInput.value }) });
          setToken(response.token);
          setCurrentUser(response.user);
          window.location.href = 'onboarding.html';
        }
      } catch (error) {
        mainSubmitBtn.disabled = false;
        mainSubmitBtn.textContent = originalBtnText;
        mainSubmitBtn.style.opacity = '1';
        mainSubmitBtn.style.cursor = 'pointer';
        
        errorDiv.textContent = error.message;
        errorDiv.style.display = 'block';
        
        // Intercept Duplicate Registration explicitly here
        if (error.message && error.message.includes('Redirecting')) {
            setTimeout(() => { window.location.href = 'login.html'; }, 1800);
        }
      }
    });

    // Check if already logged in
    if (checkAuth()) {
      const user = getCurrentUser();
      const container = document.querySelector('.auth-container');

      container.innerHTML = `
        <h1>Welcome Back!</h1>
        <p>You are already logged in as <strong>${user ? user.fullName : 'User'}</strong></p>
        
        <div style="text-align: center; margin-top: 30px;">
          <a href="dashboard.html" class="btn-submit" style="display: inline-block; text-decoration: none; margin-bottom: 15px;">Go to Dashboard</a>
          <br>
          <button onclick="logout()" style="background: none; border: none; color: #7f8c8d; cursor: pointer; text-decoration: underline;">Logout & Create New Account</button>
        </div>
        
        <div class="auth-links">
          <p><a href="index.html">Back to Home</a></p>
        </div>
      `;
    }
  </script>
</body>

</html>
