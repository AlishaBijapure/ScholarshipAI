<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - AI Counsellor</title>
  <link rel="stylesheet" href="css/signup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <div class="auth-container">
    <div style="text-align: center; margin-bottom: 5px;">
      <a href="index.html">
        <img src="vistonaut.png" alt="Vistonaut Logo" style="height: 55px; filter: drop-shadow(0 0 10px rgba(217, 70, 239, 0.4));">
      </a>
    </div>
    <h1>Create Your Account</h1>
    <p>Start your study-abroad journey today</p>

    <div id="errorMessage" class="error-message"></div>

    <form id="signupForm">
      <div class="form-group" id="fullNameGroup">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" required>
      </div>

      <div class="form-group" id="emailGroup">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group" id="passwordGroup">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="6">
      </div>

      <div class="form-group" id="otpGroup" style="display: none;">
        <label for="otpCode">6-Digit Security Code</label>
        <input type="text" id="otpCode" name="otpCode" maxlength="6" pattern="\d{6}">
      </div>

      <button type="submit" id="mainSubmitBtn" class="btn-submit">Sign Up</button>
    </form>

    <div style="text-align: center; margin: 15px 0;">
      <button id="toggleOtpBtn" type="button" style="background: none; border: none; color: var(--primary-color); cursor: pointer; font-family: 'Inter', sans-serif; font-size: 0.9rem;">Sign up without Password (OTP)</button>
    </div>

    <div class="divider"><span>OR</span></div>

    <div id="g_id_onload"
         data-client_id="1005531152056-bq8k8njrdnmbdi1tv04a1h07a0n0t74b.apps.googleusercontent.com"
         data-context="signup"
         data-ux_mode="popup"
         data-callback="handleGoogleLogin"
         data-auto_prompt="false">
    </div>

    <div class="g_id_signin"
         data-type="standard"
         data-shape="rectangular"
         data-theme="outline"
         data-text="continue_with"
         data-size="large"
         data-logo_alignment="left"
         style="display: flex; justify-content: center; width: 100%; margin-top: 15px;">
    </div>

    <div class="auth-links">
      <p>Already have an account? <a href="login.html">Login</a></p>
      <p><a href="index.html">Back to Home</a></p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    let signupMode = 'password'; // 'password', 'otp-request', 'otp-verify'
    
    const signupForm = document.getElementById('signupForm');
    const toggleOtpBtn = document.getElementById('toggleOtpBtn');
    const fullNameGroup = document.getElementById('fullNameGroup');
    const passwordGroup = document.getElementById('passwordGroup');
    const otpGroup = document.getElementById('otpGroup');
    const mainSubmitBtn = document.getElementById('mainSubmitBtn');
    const fullNameInput = document.getElementById('fullName');
    const passwordInput = document.getElementById('password');
    const otpInput = document.getElementById('otpCode');
    const emailInput = document.getElementById('email');
    const errorDiv = document.getElementById('errorMessage');

    toggleOtpBtn.addEventListener('click', () => {
      errorDiv.style.display = 'none';
      if (signupMode === 'password') {
        signupMode = 'otp-request';
        passwordGroup.style.display = 'none';
        fullNameGroup.style.display = 'none';
        passwordInput.disabled = false;
        fullNameInput.disabled = false;
        passwordInput.required = false;
        fullNameInput.required = false;
        mainSubmitBtn.textContent = 'Request Authenticator Code';
        toggleOtpBtn.textContent = 'Sign up with Password Instead';
      } else {
        signupMode = 'password';
        passwordGroup.style.display = 'block';
        fullNameGroup.style.display = 'block';
        otpGroup.style.display = 'none';
        passwordInput.disabled = false;
        fullNameInput.disabled = false;
        emailInput.disabled = false;
        passwordInput.required = true;
        fullNameInput.required = true;
        otpInput.required = false;
        mainSubmitBtn.textContent = 'Sign Up';
        toggleOtpBtn.textContent = 'Sign up without Password (OTP)';
      }
    });

    async function handleGoogleLogin(response) {
      errorDiv.style.display = 'none';
      try {
        const serverResponse = await apiRequest('/auth/google', { 
          method: 'POST', 
          body: JSON.stringify({ credential: response.credential }) 
        });
        setToken(serverResponse.token);
        setCurrentUser(serverResponse.user);
        window.location.href = 'onboarding.html';
      } catch (err) {
        errorDiv.textContent = err.message || "Google Authentication failed. Please verify API configuration.";
        errorDiv.style.display = 'block';
      }
    }

    let cachedSignupData = { fullName: '', email: '', password: '' };

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.style.display = 'none';
      
      const email = emailInput.value.trim();
      const fullName = fullNameInput.value.trim();
      const password = passwordInput.value;
      const originalBtnText = mainSubmitBtn.textContent;
      
      mainSubmitBtn.disabled = true;
      mainSubmitBtn.textContent = 'Authenticating...';
      mainSubmitBtn.style.opacity = '0.7';
      mainSubmitBtn.style.cursor = 'not-allowed';

      try {
        if (signupMode === 'password') {
          cachedSignupData = { fullName, email, password };
          // Intercept password signup to force email verification
          const res = await apiRequest('/auth/otp/send', { method: 'POST', body: JSON.stringify({ email, action: 'signup' }) });
          signupMode = 'password-verify';
          otpGroup.style.display = 'block';
          otpInput.required = true;
          // Disable prior fields to lock the state
          fullNameInput.disabled = true;
          emailInput.disabled = true;
          passwordInput.disabled = true;
          
          mainSubmitBtn.textContent = 'Verify Email & Create Account';
          mainSubmitBtn.disabled = false;
          mainSubmitBtn.style.opacity = '1';
          mainSubmitBtn.style.cursor = 'pointer';

          if (res.devCode) {
            errorDiv.style.background = 'rgba(99, 102, 241, 0.15)';
            errorDiv.style.borderColor = 'rgba(99, 102, 241, 0.4)';
            errorDiv.style.color = '#818cf8';
            errorDiv.textContent = `[Dev Mode] Verification Code: ${res.devCode}`;
            errorDiv.style.display = 'block';
          }
        } else if (signupMode === 'password-verify') {
          const payload = {
              fullName: cachedSignupData.fullName || fullNameInput.value.trim(),
              email: cachedSignupData.email || emailInput.value.trim(),
              password: cachedSignupData.password || passwordInput.value,
              otpCode: otpInput.value.trim()
          };
          const response = await apiRequest('/auth/signup', { method: 'POST', body: JSON.stringify(payload) });
          setToken(response.token);
          setCurrentUser(response.user);
          window.location.href = 'onboarding.html';
        } else if (signupMode === 'otp-request') {
          cachedSignupData.email = email;
          const res = await apiRequest('/auth/otp/send', { method: 'POST', body: JSON.stringify({ email, action: 'signup' }) });
          signupMode = 'otp-verify';
          otpGroup.style.display = 'block';
          otpInput.required = true;
          emailInput.disabled = true;
          mainSubmitBtn.textContent = 'Verify Security Code';
          mainSubmitBtn.disabled = false;
          mainSubmitBtn.style.opacity = '1';
          mainSubmitBtn.style.cursor = 'pointer';

          if (res.devCode) {
            errorDiv.style.background = 'rgba(99, 102, 241, 0.15)';
            errorDiv.style.borderColor = 'rgba(99, 102, 241, 0.4)';
            errorDiv.style.color = '#818cf8';
            errorDiv.textContent = `[Dev Mode] Verification Code: ${res.devCode}`;
            errorDiv.style.display = 'block';
          }
        } else if (signupMode === 'otp-verify') {
          const verifyEmail = cachedSignupData.email || emailInput.value.trim();
          const response = await apiRequest('/auth/otp/verify', { method: 'POST', body: JSON.stringify({ email: verifyEmail, code: otpInput.value.trim() }) });
          setToken(response.token);
          setCurrentUser(response.user);
          window.location.href = 'onboarding.html';
        }
      } catch (error) {
        mainSubmitBtn.disabled = false;
        mainSubmitBtn.textContent = originalBtnText;
        mainSubmitBtn.style.opacity = '1';
        mainSubmitBtn.style.cursor = 'pointer';
        
        errorDiv.style.background = '';
        errorDiv.style.borderColor = '';
        errorDiv.style.color = '';
        errorDiv.textContent = error.message || 'Signup failed. Please try again.';
        errorDiv.style.display = 'block';
        
        // Intercept Duplicate Registration explicitly here
        if (error.message && error.message.includes('Redirecting')) {
            setTimeout(() => { window.location.href = 'login.html'; }, 1800);
        }
      }
    });

    // Check if already logged in
    if (checkAuth()) {
      const user = getCurrentUser();
      const container = document.querySelector('.auth-container');

      container.innerHTML = `
        <h1>Welcome Back!</h1>
        <p>You are already logged in as <strong>${user ? user.fullName : 'User'}</strong></p>
        
        <div style="text-align: center; margin-top: 30px;">
          <a href="dashboard.html" class="btn-submit" style="display: inline-block; text-decoration: none; margin-bottom: 15px;">Go to Dashboard</a>
          <br>
          <button onclick="logout()" style="background: none; border: none; color: #7f8c8d; cursor: pointer; text-decoration: underline;">Logout & Create New Account</button>
        </div>
        
        <div class="auth-links">
          <p><a href="index.html">Back to Home</a></p>
        </div>
      `;
    }
  </script>
</body>

</html>
